<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#29261f"><title>巡回リスト 試作1号</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3eee1;color:#29261f;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.top{padding:10px 4px 8px;border-bottom:5px solid #777}.counts{display:flex;gap:5px;overflow:auto}.count{min-width:100px;padding:8px 12px;background:#fffdf7;border:3px solid #29261f;text-align:center;font-weight:bold}.count b{font-size:23px}.buy{border-color:#a64238}.sold{border-color:#756f63}.skip{border-color:#58708a}main{padding:12px 4px 90px;max-width:850px;margin:auto}.event{padding:16px;border:3px solid #29261f;border-radius:5px;background:repeating-linear-gradient(135deg,#fffdf7 0 14px,#f7f1e4 14px 28px);margin-bottom:12px}.eventrow{display:flex;justify-content:space-between;align-items:center;gap:8px}.event h1{font:27px serif;margin:0 0 4px}.sub{color:#625c51}.btn{padding:10px 14px;border:2px solid #29261f;background:#fffdf7;border-radius:4px;font-weight:bold}.dark{background:#29261f;color:white}.search{width:100%;padding:14px;border:3px solid #29261f;background:#fffdf7;border-radius:4px;font-size:17px;margin-bottom:9px}.filters{display:flex;overflow:auto}.filters button{white-space:nowrap;padding:10px 15px;border:2px solid #29261f;background:#fffdf7;font-weight:bold}.filters .active{background:#29261f;color:white}.selectrow{display:flex;gap:8px;margin:9px 0}.selectrow select{padding:9px;border:3px solid #29261f;background:#fffdf7}.tags{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}.tag{border:2px solid #70695e;border-radius:99px;background:none;padding:7px 15px}.tag.active{background:#70695e;color:white}.day{font-weight:bold;display:flex;gap:10px;align-items:center;margin:15px 0}.day:after{content:"";height:2px;background:#c8bfac;flex:1}.card{display:grid;grid-template-columns:110px 1fr 105px;background:#fffdf7;border:3px solid #777;margin-bottom:12px;min-height:170px}.booth{background:#82998b;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}.booth strong{font-size:23px}.booth small{letter-spacing:2px}.body{padding:13px}.name{font-size:20px;font-weight:900}.genre{color:#625c51}.stars{font-size:27px;color:#d49a22}.chips{display:flex;gap:5px;flex-wrap:wrap}.chip{background:#eee6d4;border:1px solid #d3c8b1;border-radius:99px;padding:4px 8px;font-size:12px}.want{font-weight:bold;margin-top:7px}.memo{font-size:13px;color:#686155;margin-top:5px}.thumbs{display:flex;gap:5px;margin-top:8px}.thumb{width:58px;height:48px;object-fit:cover}.state{display:flex;align-items:center;justify-content:center}.state button{width:84px;height:84px;border-radius:50%;border:3px solid #70695e;background:none;font-weight:bold}.purchased .booth{background:#9f3025}.purchased .state button{border-color:#c77c70;color:#a84235}.soldout .booth{background:#746f66}.skip .booth{background:#637a91}.route{padding:14px;background:#edf5f0;border:3px solid #587b69;margin-bottom:14px}.route button{width:100%;padding:13px;background:#356b59;color:#fff;border:0;border-radius:5px;font-weight:bold}.fab{position:fixed;right:18px;bottom:23px;width:68px;height:68px;border:0;border-radius:50%;background:#29261f;color:#fff;font-size:36px;z-index:5}.nav{position:fixed;bottom:0;left:0;right:0;padding:7px 12px;background:#fffdf7;border-top:2px solid #c7bfaf;z-index:4}.nav button{width:100%;padding:13px;background:#29261f;color:#fff;border:0;border-radius:6px;font-weight:bold}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:10;align-items:flex-end}.modal.open{display:flex}.sheet{width:100%;max-height:94vh;overflow:auto;background:#f3eee1;border-radius:18px 18px 0 0;padding:16px 10px 25px}.sheet h2{margin:0 0 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field{margin:9px 0}.field label{display:block;font-weight:bold;font-size:13px;margin-bottom:4px}.field input,.field textarea,.field select{width:100%;padding:11px;background:#fffdf7;border:2px solid #c7beab;border-radius:5px}.field textarea{min-height:85px}.priority{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.priority button{padding:11px 3px;background:#fffdf7;border:2px solid #29261f}.priority .active{background:#356b59;color:#fff}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:15px}.actions button{padding:14px;border:3px solid #29261f;background:#fffdf7;font-weight:bold}.actions .save{background:#29261f;color:#fff}
@media(max-width:560px){.card{grid-template-columns:92px 1fr}.state{grid-column:2;justify-content:flex-end;padding:5px 12px}.booth strong{font-size:19px}}
</style></head><body>
<div class="top"><div class="counts" id="counts"></div></div><main>
<section class="event"><div class="eventrow"><div><h1 id="ename">ワンフェス</h1><div class="sub" id="einfo"></div></div><button class="btn dark" onclick="events()">切替 ▼</button></div></section>
<input class="search" id="q" placeholder="⌕ サークル名・卓番・メモで検索" oninput="render()"><div class="filters" id="filters"></div>
<div class="selectrow"><select id="sort" onchange="render()"><option value="booth">卓番順</option><option value="priority">優先度順</option><option value="name">サークル名順</option></select><select id="day" onchange="render()"><option value="">全日程</option></select></div>
<div class="tags" id="tags"></div><div id="route"></div><div id="list"></div></main>
<button class="fab" onclick="item()">＋</button><div class="nav"><button onclick="toggleRoute()">🚶 巡回モード：次の目的地</button></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<script>
const K="route_v1";let db=JSON.parse(localStorage.getItem(K)||"null"),filter="all",routeMode=false,edit=null;if(!db){let e={id:uid(),name:"ワンフェス",date:"2026-08-28",venue:"幕張メッセ",items:[{id:uid(),day:"2026-08-28",booth:"東1-2b",name:"サバーニャ",tags:["美少女"],want:"新作フィギュア",priority:2,memo:"注意",price:9000,status:"purchased"},{id:uid(),day:"2026-08-28",booth:"東5-4a",name:"鯖猫缶",tags:["メカ"],want:"新作キット",priority:3,memo:"部数少なめ注意",price:12000,status:"todo"}]};db={events:[e],current:e.id};save()}function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function save(){localStorage.setItem(K,JSON.stringify(db))}function cur(){return db.events.find(e=>e.id===db.current)}function esc(s=""){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function close(){modal.classList.remove("open")}
function events(){sheet.innerHTML="<h2>イベントを選択</h2>"+db.events.map(e=>`<button class=btn style="width:100%;margin:4px 0;text-align:left" onclick="setEvent('${e.id}')">${esc(e.name)}<br><small>${e.date}　${esc(e.venue)}</small></button>`).join("")+`<div class=actions><button onclick=close()>閉じる</button><button class=save onclick=newEvent()>＋ 新規</button></div>`;modal.classList.add("open")}
function setEvent(id){db.current=id;save();close();render()}function newEvent(){sheet.innerHTML=`<h2>イベント登録</h2><div class=field><label>イベント名</label><input id=en></div><div class=grid><div class=field><label>開催日</label><input id=ed type=date></div><div class=field><label>会場</label><input id=ev></div></div><div class=actions><button onclick=close()>キャンセル</button><button class=save onclick=saveEvent()>保存</button></div>`}
function saveEvent(){let e={id:uid(),name:en.value||"名称未設定",date:ed.value,venue:ev.value,items:[]};db.events.push(e);db.current=e.id;save();close();render()}
let pri=2;function pick(n){pri=n;[1,2,3].forEach(i=>document.getElementById("p"+i).classList.toggle("active",i===n))}
function item(id=null){edit=id;let x=id?cur().items.find(i=>i.id===id):null;pri=x?.priority||2;sheet.innerHTML=`<h2>${x?"卓情報を編集":"卓を登録"}</h2><div class=grid><div class=field><label>開催日</label><input id=fd type=date value="${x?.day||cur().date}"></div><div class=field><label>卓番</label><input id=fb placeholder="例：東5-4a" value="${esc(x?.booth)}"></div></div><div class=field><label>サークル名</label><input id=fn placeholder="サークル名" value="${esc(x?.name)}"></div><div class=field><label>優先度</label><div class=priority>${[[3,"★★★","絶対行く"],[2,"★★","気になる"],[1,"★","余裕あれば"]].map(a=>`<button id=p${a[0]} class="${pri==a[0]?"active":""}" onclick="pick(${a[0]})">${a[1]}<br><small>${a[2]}</small></button>`).join("")}</div></div><div class=field><label>ジャンル / タグ（カンマ区切り）</label><input id=ft placeholder="例：創作, ロボ, 島中" value="${esc((x?.tags||[]).join(", "))}"></div><div class=field><label>欲しい物</label><input id=fw placeholder="例：新刊、新作フィギュア" value="${esc(x?.want)}"></div><div class=grid><div class=field><label>購入予定金額</label><input id=fp type=number value="${x?.price||""}"></div><div class=field><label>リンク</label><input id=fl type=url value="${esc(x?.link)}"></div></div><div class=field><label>メモ</label><textarea id=fm placeholder="新刊狙う、部数少なめ注意、など">${esc(x?.memo)}</textarea></div><div class=field><label>写真（最大3枚）</label><input id=fi type=file accept="image/*" multiple></div><div class=actions><button onclick=close()>キャンセル</button><button class=save onclick=saveItem()>保存</button></div>${x?`<button class=btn style="width:100%;margin-top:8px" onclick="del('${x.id}')">この卓を削除</button>`:""}`;modal.classList.add("open")}
function saveItem(){let e=cur(),old=edit?e.items.find(i=>i.id===edit):null,x={id:old?.id||uid(),day:fd.value,booth:fb.value.trim(),name:fn.value.trim()||"名称未設定",priority:pri,tags:ft.value.split(",").map(s=>s.trim()).filter(Boolean),want:fw.value.trim(),price:+fp.value||0,link:fl.value,memo:fm.value,status:old?.status||"todo",imgs:old?.imgs||[]};let fs=[...fi.files].slice(0,3);if(fs.length){let a=[];fs.forEach(f=>{let r=new FileReader();r.onload=()=>{a.push(r.result);if(a.length===fs.length){x.imgs=a;finish()}};r.readAsDataURL(f)})}else finish();function finish(){if(old)Object.assign(old,x);else e.items.push(x);save();close();render()}}
function del(id){if(confirm("削除しますか？")){cur().items=cur().items.filter(x=>x.id!==id);save();close();render()}}
function status(id,s){let x=cur().items.find(i=>i.id===id);if(x){x.status=s;save();render()}}
function toggleRoute(){routeMode=!routeMode;document.querySelector(".nav button").textContent=routeMode?"✕ 巡回モードを終了":"🚶 巡回モード：次の目的地";render();scrollTo(0,0)}
function render(){let e=cur(),a=e.items,c={todo:0,purchased:0,soldout:0,skip:0};a.forEach(x=>c[x.status]=(c[x.status]||0)+1);ename.textContent=e.name;einfo.textContent=`${e.date||"日付未設定"}　${e.venue||"会場未設定"}`;counts.innerHTML=`<div class=count>登録 <b>${a.length}</b></div><div class="count buy">購入 <b>${c.purchased}</b></div><div class="count sold">完売 <b>${c.soldout}</b></div><div class="count skip">見送り <b>${c.skip}</b></div><div class=count>未訪問 <b>${c.todo}</b></div>`;filters.innerHTML=[["all","全て"],["todo","未訪問"],["purchased","購入"],["soldout","完売"],["skip","見送り"]].map(v=>`<button class="${filter==v[0]?"active":""}" onclick="filter='${v[0]}';render()">${v[1]}</button>`).join("");let days=[...new Set(a.map(x=>x.day).filter(Boolean))].sort();day.innerHTML='<option value="">全日程</option>'+days.map(d=>`<option value="${d}">${d.slice(5)}</option>`).join("");let ts=[...new Set(a.flatMap(x=>x.tags||[]))];tags.innerHTML=ts.map(t=>`<button class=tag onclick="q.value='${esc(t)}';render()">${esc(t)}</button>`).join("");let qv=q.value.toLowerCase(),dv=day.value;a=a.filter(x=>(filter=="all"||x.status==filter)&&(!dv||x.day==dv)&&[x.booth,x.name,x.want,x.memo,(x.tags||[]).join(" ")].join(" ").toLowerCase().includes(qv));if(sort.value=="priority")a.sort((x,y)=>y.priority-x.priority);else if(sort.value=="name")a.sort((x,y)=>x.name.localeCompare(y.name));else a.sort((x,y)=>x.booth.localeCompare(y.booth));let n=e.items.filter(x=>x.status=="todo").sort((x,y)=>y.priority-x.priority)[0];route.innerHTML=routeMode&&n?`<div class=route><h2>次の目的地</h2><b>${esc(n.booth)}　${esc(n.name)}</b><p>${"★".repeat(n.priority)}　${esc(n.want||"")}</p><button onclick="status('${n.id}','visited')">✓ 到着・訪問済みにする</button></div>`:"";list.innerHTML=a.length?a.map(card).join(""):"<div style='text-align:center;padding:35px;color:#777'>該当する卓がありません。</div>"}
function card(x){let txt={todo:"○",visited:"訪問",purchased:"購入",soldout:"完売",skip:"見送り"}[x.status]||"○";return `<div class="card ${x.status}"><div class=booth><small>BOOTH</small><strong>${esc(x.booth)}</strong></div><div class=body><div class=name>${esc(x.name)}</div><div class=genre>${esc(x.genre||"")}</div><div class=stars>${"★".repeat(x.priority)}</div><div class=chips>${(x.tags||[]).map(t=>`<span class=chip>${esc(t)}</span>`).join("")}</div>${x.want?`<div class=want>${esc(x.want)}</div>`:""}${x.memo?`<div class=memo>${esc(x.memo)}</div>`:""}<div class=thumbs>${(x.imgs||[]).map(i=>`<img class=thumb src="${i}">`).join("")}</div><button class=btn onclick="item('${x.id}')">詳細・編集</button></div><div class=state><button onclick="cycle('${x.id}')">${txt}</button></div></div>`}
function cycle(id){let x=cur().items.find(i=>i.id===id),next={todo:"visited",visited:"purchased",purchased:"todo",soldout:"todo",skip:"todo"};if(x)status(id,next[x.status])}
render();
</script></body></html>
